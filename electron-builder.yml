appId: co.tallynz.tally
productName: Tally
copyright: Tally Marketing Limited
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/@anthropic-ai/claude-agent-sdk*/**
  - node_modules/playwright-core/**
extraResources:
  - from: .claude/skills
    to: agent-home/.claude/skills
publish: null
mac:
  icon: build/icon.icns
  category: public.app-category.business
  # dmg for a first install, zip for the in-app updater (src/main/updater.ts)
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  identity: null
  hardenedRuntime: false
  darkModeSupport: true
dmg:
  title: Tally
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
